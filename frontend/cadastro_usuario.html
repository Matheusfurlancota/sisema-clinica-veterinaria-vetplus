<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vet - Cadastro de Usuário</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .register-container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        .register-container h2 {
            color: #28a745;
            margin-bottom: 20px;
        }
        .register-container button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        .register-container button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo-container"><span class="logo">&#128100;</span></div>
        <div class="header-content">
            <h1>Cadastro de Novo Usuário</h1>
            <p>Clientes se cadastram imediatamente. Funcionários e Admins precisam de validação.</p>
        </div>
    </header>

    <div class="register-container">
        <h2>Criar Conta</h2>
        <p id="message" style="color: red;"></p>
        <form id="formCadastroUsuario">
            <label for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">Email (Login):</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required>

            <label for="cargo">Tipo de Conta:</label>
            <select id="cargo" name="cargo" required>
                <option value="cliente">Cliente</option>
                <option value="funcionario">Funcionário (Requer validação Admin)</option>
            </select>

            <button type="submit">✅ Cadastrar</button>
        </form>
        <p style="margin-top: 15px;"><a href="login.html">Já tem conta? Faça login.</a></p>
    </div>
    
    <script src="auth.js"></script>
    <script>
        // Lógica de cadastro no Front-end
        const AUTH_API_URL = `${BASE_API_URL}?entity=auth`; // Necessita da BASE_API_URL do auth.js
        
        document.getElementById('formCadastroUsuario').addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const form = event.target;
            const messageElement = document.getElementById('message');
            messageElement.textContent = '';
            
            const userData = {
                action: 'register', 
                nome: form.nome.value,
                email: form.email.value,
                senha: form.senha.value,
                cargo: form.cargo.value
            };

            try {
                const response = await fetch(AUTH_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(userData)
                });
                
                const result = await response.json();

                if (response.ok) {
                    messageElement.style.color = 'green';
                    messageElement.textContent = result.message + ' Redirecionando para Login...';
                    form.reset();
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000); 
                } else {
                    messageElement.style.color = 'red';
                    messageElement.textContent = result.message || 'Erro ao processar cadastro.';
                }
            } catch (error) {
                messageElement.style.color = 'red';
                messageElement.textContent = 'Erro de conexão com o servidor. Verifique o console.';
                console.error('Network Error:', error);
            }
        });
    </script>
</body>
</html>
